
name: Update Language Statistics

on:
  # Run whenever you push to the profile repository
  push:
    branches:
      - main

  # Allow other repositories to trigger an update
  repository_dispatch:
    types: [update-language-stats]

  # Allow manual execution from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-languages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run language statistics script
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/update_language_stats.py

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No language statistics changes."
          else
            git commit -m "Update language statistics"
            git push
          fi
